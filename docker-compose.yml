services:
  cass1:
    image: cassandra:4.1
    container_name: cass1
    networks: [cassnet]
    ports: ["9042:9042"]
    cap_add: [NET_ADMIN]
    environment:
      CASSANDRA_CLUSTER_NAME: consistency_lab
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 60s

  cass2:
    image: cassandra:4.1
    container_name: cass2
    networks: [cassnet]
    ports: ["9043:9042"]
    cap_add: [NET_ADMIN]
    environment:
      CASSANDRA_CLUSTER_NAME: consistency_lab
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    # 本节点自身就绪才算 healthy：CQL 端口在服务 + bootstrap 已结束(Mode: NORMAL)
    # 不能沿用 cass1 的 "nodetool status | grep '^UN'"——那会匹配到 cass1 自己的行
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q running && nodetool netstats | grep -q 'Mode: NORMAL'"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 60s
    depends_on:
      cass1:
        condition: service_healthy

  cass3:
    image: cassandra:4.1
    container_name: cass3
    networks: [cassnet]
    ports: ["9044:9042"]
    cap_add: [NET_ADMIN]
    environment:
      CASSANDRA_CLUSTER_NAME: consistency_lab
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q running && nodetool netstats | grep -q 'Mode: NORMAL'"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 60s
    depends_on:
      cass2:
        condition: service_healthy

networks:
  cassnet:
    driver: bridge